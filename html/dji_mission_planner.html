<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJI Mission Planner</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="../css/dji_mission_planner.css"/>
</head>
<body>

<!-- ── Top Bar ── -->
<div id="topbar">
  <div class="logo">DJI <span>PLANNER</span><span class="logo-version" id="appVersion"></span></div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="ghost" id="btnAddWP" title="Click map to place waypoints">
      📍 Add Waypoint
    </button>
    <button class="ghost" id="btnAddPOI" title="Click map to place a Point of Interest">
      🎯 Add POI
    </button>
    <button class="ghost" id="btnSelect" title="Select / pan mode">
      🖱 Select
    </button>
    <button class="ghost" id="btnUnselectAll" title="Clear current selection">
      ✖ Unselect All
    </button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="ghost" id="btnClear" title="Clear all waypoints and POIs">🗑 Clear All</button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="ghost" id="btnLocate" title="Center map on your current location">📡 Use My Location</button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="ghost" id="btnSaveMission" title="Save mission JSON in the current selected folder">💾 Save Mission</button>
    <button class="ghost" id="btnLoadMission" title="Load mission JSON from the current selected folder">📂 Load Mission</button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="accent2" id="btnExport">⬇ Export KMZ</button>
  </div>
  <div class="sep"></div>
  <div class="tb-group flythrough-controls" id="flythroughControls">
    <button class="ghost" id="btnFTPlay" title="Start virtual flythrough">▶ Play</button>
    <button class="ghost" id="btnFTPause" title="Pause virtual flythrough">⏸ Pause</button>
    <button class="ghost" id="btnFTStop" title="Stop virtual flythrough">⏹ Stop</button>
    <select id="ftSpeed" title="Flythrough speed">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
    </select>
    <label class="ft-toggle" title="Show/hide camera field of view">
      <input id="chkFTFov" type="checkbox" />
      👁 FOV
    </label>
    <input id="ftSeek" type="range" min="0" max="1000" value="0" title="Seek flythrough timeline" />
    <span id="ftProgress">00:00 / 00:00</span>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button id="btnFPV" class="ghost" title="Toggle FPV camera panel">📷 FPV</button>
  </div>
  <div id="stats">
    WP: <span id="statWP">0</span> &nbsp; POI: <span id="statPOI">0</span> &nbsp; Dist: <span id="statDist">0 m</span>
  </div>
</div>

<!-- ── Main ── -->
<div id="main">

  <div id="map"></div>

  <div id="ftGraphOverlay" aria-hidden="true">
    <canvas id="ftGraphCanvas"></canvas>
  </div>

  <div id="fpv-panel" style="
    display:none; position:absolute; bottom:20px; right:320px;
    width:800px; height:450px;
    border:1px solid #30363d; border-radius:8px; overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.5); z-index:500;">
  </div>

  <div id="sidebar">
    <div class="panel-title">Mission Settings</div>
    <div id="defaults-panel">
      <div class="mission-name-row">
        <label>Mission Name</label>
        <input id="missionName" type="text" value="MyMission" placeholder="e.g. Survey_Run1"/>
      </div>
      <div class="field-row">
        <label>Default Alt.</label>
        <input id="defAlt" type="number" value="50" min="1" max="500" step="1"/>
        <span class="unit">m</span>
        <button class="ghost small-apply" id="btnApplyDefaultAlt" title="Apply default altitude to all waypoints">Apply all</button>
      </div>
      <div class="field-row">
        <label>Default Speed</label>
        <input id="defSpeed" type="number" value="43" min="4" max="54" step="1"/>
        <span class="unit">km/h</span>
        <button class="ghost small-apply" id="btnApplyDefaultSpeed" title="Apply default speed to all waypoints">Apply all</button>
      </div>
      <div class="field-row">
        <label>Drone</label>
        <select id="defDrone">
          <option value="air3s" selected>DJI Air 3S</option>
          <option value="custom">Custom Camera</option>
        </select>
      </div>
      <div class="field-row">
        <label>Cam HFOV</label>
        <input id="defHfov" type="number" value="82" min="30" max="140" step="1"/>
        <span class="unit">deg</span>
      </div>
      <div class="field-row">
        <label>Const. HAG</label>
        <input id="defConstHag" type="number" value="50" min="1" max="500" step="1"/>
        <span class="unit">m</span>
        <button class="ghost small-apply" id="btnApplyConstHag" title="Set all waypoints to a constant height above ground">Apply all</button>
      </div>
      <div class="field-row">
        <label>Finish Action</label>
        <select id="defFinish">
          <option value="goHome">Return to Home</option>
          <option value="noAction">Hover</option>
          <option value="autoLand">Auto Land</option>
          <option value="gotoFirstWaypoint">Go to WP1</option>
        </select>
      </div>
      <div class="field-row">
        <label>RC Lost</label>
        <select id="defRCLost">
          <option value="goContinue">Continue Mission</option>
          <option value="goBack">Return to Home</option>
        </select>
      </div>
      <div class="field-row">
        <label>Heading Mode</label>
        <select id="defHeading">
          <option value="followWayline">Follow Wayline</option>
          <option value="manually">Manual (per WP)</option>
          <option value="towardsPOI">Toward POI</option>
        </select>
      </div>
    </div>

    <div class="panel-title">Waypoints &amp; POIs</div>
    <div id="wp-list-wrap">
      <div class="empty-state" id="emptyState">
        <div class="big">🗺</div>
        Click <b>Add Waypoint</b> then<br>click the map to place points.<br>
        Add a <b>POI</b> to auto-calculate<br>gimbal pitch &amp; heading.
      </div>
      <div id="wp-list"></div>
    </div>

    <div id="detail-panel">
      <div class="panel-title">Selected Item</div>
      <div id="detail-content">
        <div id="detail-placeholder">Nothing selected</div>
      </div>
    </div>
  </div>

</div>

<!-- ── Status Bar ── -->
<div id="statusbar">
  <span id="sbMode" class="status-ok">MODE: SELECT</span>
  <span id="sbCursor">Lat: — Lon: —</span>
  <span id="sbStatus">Ready</span>
</div>

<script>
  const APP_VERSION = 'v3.6';
  window.APP_VERSION = APP_VERSION;

  window.addEventListener('DOMContentLoaded', () => {
    const versionEl = document.getElementById('appVersion');
    if (versionEl) {
      versionEl.textContent = `(${APP_VERSION})`;
    }
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../source/map/MapController.js"></script>
<script src="../source/services/LocationService.js"></script>
<script src="../source/services/ElevationService.js"></script>
<script src="../source/mission/Mission.js"></script>
<script src="../source/ui/PlannerUI.js"></script>
<script src="../source/export/ExportKmz.js"></script>
<script src="../source/mission/MissionSerializer.js"></script>
<script src="../source/storage/LocalStorageBackend.js"></script>
<script src="../source/storage/FileSystemBackend.js"></script>
<script src="../source/storage/PersistentStorage.js"></script>
<script src="../source/virtualflight/FPVController.js"></script>
<script src="../source/virtualflight/FlythroughController.js"></script>
<script src="../source/virtualflight/FlightGraph.js"></script>
<script src="../source/app/App.js"></script>
<script src="../source/app/dji_mission_planner.js"></script>
</body>
</html>
