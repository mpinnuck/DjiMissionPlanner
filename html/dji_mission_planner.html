<script>
  // Run synchronously before first paint so --browser-ui-top is correct
  // at the CSS cascade and the topbar never flashes in the wrong position.
  (function () {
    var vv = window.visualViewport;
    var inset = 0;
    if (vv && typeof vv.offsetTop === 'number' && isFinite(vv.offsetTop)) {
      var scale = (typeof vv.scale === 'number' && isFinite(vv.scale)) ? vv.scale : 1;
      if (scale <= 1.01) {
        inset = Math.max(0, Math.min(96, Math.round(vv.offsetTop)));
      }
    }
    document.documentElement.style.setProperty('--browser-ui-top', inset + 'px');

    var ua = navigator.userAgent || '';
    var isAppleMobile = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
    var mobileLayoutQuery = '(any-pointer: coarse) and ((max-width: 1024px) or (max-height: 820px))';
    var hasTouch = (navigator.maxTouchPoints || 0) > 0
      || window.matchMedia('(any-pointer: coarse)').matches
      || window.matchMedia('(hover: none)').matches;
    document.documentElement.classList.toggle('touch-capable', hasTouch);
    document.body && document.body.classList.toggle('screen-sm', window.matchMedia(mobileLayoutQuery).matches);
    document.documentElement.classList.toggle('screen-sm', window.matchMedia(mobileLayoutQuery).matches);
    if (isAppleMobile && isSafari) {
      document.documentElement.classList.add('mobile-safari-pre');
    }
  }());
</script>

<script>
  const APP_VERSION = 'v7.18';
  window.APP_VERSION = APP_VERSION;

  window.addEventListener('DOMContentLoaded', () => {
    // mobile-safari-pre was set synchronously in <head> to avoid flash on refresh.
    if (document.documentElement.classList.contains('mobile-safari-pre')) {
      document.body.classList.add('mobile-safari');
    }
    const isMobileSafari = document.documentElement.classList.contains('mobile-safari-pre');

    const versionEl = document.getElementById('appVersion');
    if (versionEl) {
      versionEl.textContent = `(${APP_VERSION})`;
    }

    const sbVersionEl = document.getElementById('sbVersion');
    if (sbVersionEl) {
      sbVersionEl.textContent = APP_VERSION;
    }

    const smallScreenQuery = window.matchMedia('(any-pointer: coarse) and ((max-width: 1024px) or (max-height: 820px))');
    const runStagedReflow = fn => {
      if (typeof fn !== 'function') {
        return;
      }

      requestAnimationFrame(fn);
      setTimeout(fn, 180);
      setTimeout(fn, 500);
    };
    const refreshMapSize = () => {
      const map = window.missionPlannerApp
        && window.missionPlannerApp.mapController
        && window.missionPlannerApp.mapController.map;
      if (map && typeof map.invalidateSize === 'function') {
        map.invalidateSize({ pan: false, debounceMoveend: true });
      }
    };
    const applyScreenSmClass = () => {
      document.body.classList.toggle('screen-sm', smallScreenQuery.matches);
      document.documentElement.classList.toggle('screen-sm', smallScreenQuery.matches);

      // iPad Safari can report final viewport/layout a little later.
      // Staged invalidations ensure Leaflet tiles fill the full width on first paint.
      runStagedReflow(refreshMapSize);
    };
    applyScreenSmClass();
    if (typeof smallScreenQuery.addEventListener === 'function') {
      smallScreenQuery.addEventListener('change', applyScreenSmClass);
    } else if (typeof smallScreenQuery.addListener === 'function') {
      smallScreenQuery.addListener(applyScreenSmClass);
    }

    let lastStableTopInset = 0;
    let lastStableAppHeight = Number.isFinite(window.innerHeight) ? Math.round(window.innerHeight) : 0;
    const statusbarEl = document.getElementById('statusbar');

    const updateLayoutMetrics = () => {
      const vv = window.visualViewport;
      const fallbackHeight = Number.isFinite(window.innerHeight) ? window.innerHeight : 0;
      const viewportHeightRaw = vv && Number.isFinite(vv.height) ? Math.round(vv.height) : Math.round(fallbackHeight);

      if (!isMobileSafari) {
        let topInset = lastStableTopInset;
        if (vv) {
          const scale = Number.isFinite(vv.scale) ? vv.scale : 1;
          const rawOffsetTop = Number.isFinite(vv.offsetTop) ? vv.offsetTop : 0;

          if (scale <= 1.01) {
            topInset = Math.max(0, Math.min(96, Math.round(rawOffsetTop)));
            lastStableTopInset = topInset;
          }
        }

        document.documentElement.style.setProperty('--browser-ui-top', `${lastStableTopInset}px`);
      }

      const safeAppHeight = Number.isFinite(viewportHeightRaw) && viewportHeightRaw > 320
        ? viewportHeightRaw
        : (Number.isFinite(fallbackHeight) && fallbackHeight > 320 ? Math.round(fallbackHeight) : lastStableAppHeight);

      if (Number.isFinite(safeAppHeight) && safeAppHeight > 320) {
        lastStableAppHeight = safeAppHeight;
      }

      document.documentElement.style.setProperty('--app-height', `${lastStableAppHeight}px`);

      if (statusbarEl) {
        const measuredStatusbarHeight = Math.ceil(statusbarEl.getBoundingClientRect().height);
        if (Number.isFinite(measuredStatusbarHeight) && measuredStatusbarHeight > 0) {
          document.documentElement.style.setProperty('--statusbar-height', `${measuredStatusbarHeight}px`);
        }
      }
    };

    updateLayoutMetrics();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateLayoutMetrics);
      if (!isMobileSafari) {
        window.visualViewport.addEventListener('scroll', updateLayoutMetrics);
      }
    }
    window.addEventListener('resize', updateLayoutMetrics);
    window.addEventListener('orientationchange', () => {
      updateLayoutMetrics();
      runStagedReflow(updateLayoutMetrics);
      runStagedReflow(refreshMapSize);
    });

    const toolbarLabelMap = {
      btnAddWP: '📍 Add WP',
      btnAddPOI: '🎯 Add POI',
      btnSelect: '🖱 Select',
      btnUnselectAll: '✖ Clear Sel',
      btnClear: '🗑 Clear',
      btnLocate: '📡 Locate',
      btnToggleStreets: '🗺 Streets',
      btnSaveMission: '💾 Save',
      btnLoadMission: '📂 Load',
      btnExport: '⬇ Export'
    };

    const compactTopbarQuery = window.matchMedia('(any-pointer: coarse) and (max-width: 1700px)');

    const applyCompactToolbarLabels = () => {
      const useCompact = compactTopbarQuery.matches;
      Object.entries(toolbarLabelMap).forEach(([id, shortLabel]) => {
        const button = document.getElementById(id);
        if (!button) {
          return;
        }

        if (!button.dataset.fullLabel) {
          button.dataset.fullLabel = button.textContent.trim();
        }

        button.textContent = useCompact ? shortLabel : button.dataset.fullLabel;
      });
    };

    applyCompactToolbarLabels();
    if (typeof compactTopbarQuery.addEventListener === 'function') {
      compactTopbarQuery.addEventListener('change', applyCompactToolbarLabels);
    } else if (typeof compactTopbarQuery.addListener === 'function') {
      compactTopbarQuery.addListener(applyCompactToolbarLabels);
    }
  });
</script>
